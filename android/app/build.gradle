plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.myapp"
    compileSdk flutter.compileSdkVersion
    ndkVersion "27.1.12297006"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.muhammaddaniyal.plantify"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 23
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
        }
    }

    // Default APKs load native libraries directly to minimize installed storage.
    // Opt in to compressed native libraries for a smaller download APK. Android
    // extracts those libraries once on installation; runtime code is identical.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = providers.gradleProperty('plantifyCompactApk')
                .map { it.toBoolean() }.getOrElse(false)
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// Track real project files explicitly. The installed Flutter Gradle dependency
// parser can retain escaped spaces in this workspace's paths and reuse old Dart
// output after a source change. Keep SDK caches and global Flutter files intact.
tasks.matching { it.name.startsWith('compileFlutterBuild') }.configureEach {
    inputs.files(fileTree('../../lib') { include '**/*.dart' })
        .withPropertyName('plantifyDartSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(fileTree('../../assets'))
        .withPropertyName('plantifyAssets')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(file('../../pubspec.yaml'), file('../../pubspec.lock'))
        .withPropertyName('plantifyPackages')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}
